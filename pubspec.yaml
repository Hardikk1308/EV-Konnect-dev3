name: kawach
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0-209.1.beta

dependencies:
  flutter:
    sdk: flutter

  # Core UI and layout
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3

  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^2.1.0
  location: ^5.0.3

  # Google Maps Extras
  google_place: ^0.4.7
  flutter_polyline_points: ^1.0.0

  # Firebase
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  firebase_database: 11.3.4
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  google_sign_in: ^6.1.0
  

  # UI & UX
  pin_code_fields: ^8.0.1
  step_tracker: ^0.0.5
  intl: ^0.18.1
  flutter_staggered_grid_view: ^0.7.0

  # Networking
  http: ^0.13.6

  # Permissions
  permission_handler: ^11.0.1
  glass_kit: ^4.0.1
  google_fonts: ^4.0.4
  flutter_launcher_icons: ^0.14.3
  flutter_typeahead: ^5.2.0
  fl_chart: ^0.71.0
  syncfusion_flutter_charts: ^29.1.40
  firebase_messaging: ^15.2.6
  file_picker: ^10.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences: ^2.2.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
